name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 构建 Vue 前端
        run: npm run build

      - name: 打包便携版 exe
        run: npx electron-builder --win portable --x64

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: 壮族文化数字资源库-便携版
          path: release/*.exe
          if-no-files-found: error
